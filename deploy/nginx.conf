# MailPilot — nginx front door.
#
# One origin serves both halves: the built panel as static files, and /api
# proxied to uvicorn on the loopback. Same-origin means no CORS to configure
# and no third-party cookie rules to fight.
#
# PORT 8080, NOT 80.
#
# This machine already runs Traefik on 80 and 443, fronting an n8n stack that
# has been up for weeks. Binding 80 here would have taken that down — nginx
# refused to start for exactly that reason, which is the failure mode working
# as intended.
#
# `default_server` is deliberately absent too: it is a per-port claim, and
# claiming it invites a future conflict for no benefit while this is the only
# site nginx serves.
#
# When there is a domain, the better home for this is a Traefik route beside
# n8n rather than a second web server — see deploy/README.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/mailpilot/web;
    index index.html;

    # Uploaded images and AI-written HTML are served from this origin, so the
    # browser is told plainly not to re-interpret any of it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8M;   # room for a 4MB image plus base64 overhead

    # ---- the API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The live event feed is server-sent events. Buffering holds every
        # frame until the stream closes, which for an open stream means
        # forever — so it is off for this location only.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ---- the panel ----
    # Vite fingerprints these filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached, or a browser keeps loading an old bundle
    # that points at asset filenames the deploy has already removed.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # A hash-routed SPA: every path that is not a real file is index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
